<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#38bdf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bakul Sayur">
  <title>Bakul Sayur - Manajemen Pengeluaran</title>

  <style>
    :root {
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --surface: #ffffff;
      --background: #f4f7fb;
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--surface);
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--surface);
    }

    .loading-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.18), transparent 34%),
        var(--background);
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(340px, calc(100vw - 36px));
      padding: 30px 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: var(--primary);
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(56, 189, 248, 0.32);
    }

    .loading-card h1 {
      margin: 0;
      color: var(--text);
      font-size: 21px;
      letter-spacing: -0.03em;
    }

    .loading-card p {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .loader {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border: 4px solid #e2e8f0;
      border-top-color: var(--primary-dark);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fallback {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 9;
    }

    .fallback a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      padding: 0 16px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 640px) {
      .fallback {
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
      }

      .fallback a {
        min-height: 38px;
        padding: 0 13px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="app-wrapper">
    <div class="loading-screen" id="loading-screen" aria-live="polite">
      <div class="loading-card">
        <div class="brand-mark">BS</div>
        <h1>Bakul Sayur</h1>
        <p>Memuat sistem manajemen pengeluaran...</p>
        <div class="loader" aria-hidden="true"></div>
      </div>
    </div>

    <iframe
      id="app-frame"
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbzvNFqdIcDnUIrq0jDUmDfLppEOYkQsQjX6WyhNYh_yGnDAa60OUiq6yAKldpjreTQi2Q/exec"
      title="Bakul Sayur - Manajemen Pengeluaran"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <div class="fallback">
      <a href="https://script.google.com/macros/s/AKfycbzvNFqdIcDnUIrq0jDUmDfLppEOYkQsQjX6WyhNYh_yGnDAa60OUiq6yAKldpjreTQi2Q/exec" target="_blank" rel="noopener noreferrer">
        Buka langsung
      </a>
    </div>
  </main>

  <script>
    (function() {
      'use strict';

      var frame = document.getElementById('app-frame');
      var loading = document.getElementById('loading-screen');
      var loadingHidden = false;

      function hideLoading() {
        if (loadingHidden) {
          return;
        }

        loadingHidden = true;
        loading.classList.add('hidden');
      }

      frame.addEventListener('load', function() {
        window.setTimeout(hideLoading, 350);
      });

      window.setTimeout(hideLoading, 8000);
    })();
  </script>
</body>
</html>
